 async resetData(mode){
   if(STORE.role!=='supervisor'||!fb.auth.currentUser||!STORE.connected)throw Error('Se requiere Supervisión conectada a Firebase.');
   const {fsm,db}=fb;
   const purge=async(names)=>{
     let deleted=0;
     for(const name of names){
       const list=await fsm.getDocs(fsm.collection(db,name));
       for(let i=0;i<list.docs.length;i+=200){const batch=fsm.writeBatch(db);
         list.docs.slice(i,i+200).forEach(ref=>batch.delete(ref.ref));
         await batch.commit();deleted+=Math.min(200,list.docs.length-i);
       }
     }
     return deleted;
   };
   if(mode==='counts')return purge(['recount_entries','recounts','counts','markers','surplus']);
   if(mode==='catalog'){
     const rows=await fsm.getDocs(fsm.query(fsm.collection(db,'counts'),fsm.limit(1)));
     if(!rows.empty)throw Error('Aún hay conteos. Bórralos primero o utiliza Reiniciar todo.');
     return purge(['recount_entries','recounts','markers','stock','catalog']);
   }
   if(mode==='all'){
     let deleted=await purge(['recount_entries','recounts','counts','markers','surplus','stock','catalog']);
     // Reinicio de pruebas: también limpia las sesiones de colaboradores; conserva supervisores.
     const profiles=await fsm.getDocs(fsm.collection(db,'profiles'));
     const operators=profiles.docs.filter(doc=>doc.data().role==='operator');
     for(let i=0;i<operators.length;i+=200){
       const batch=fsm.writeBatch(db);
       operators.slice(i,i+200).forEach(doc=>batch.delete(doc.ref));
       await batch.commit();deleted+=Math.min(200,operators.length-i);
     }
     return deleted;
   }
   throw Error('Opción de borrado desconocida.');
 },
 async start(role,uid){
  const {fsm,db}=fb;
  unsub.forEach(f=>f());unsub=[];
  STORE.products=[];STORE.counts=[];STORE.surplus=[];STORE.markers=[];STORE.recounts=[];STORE.recountEntries=[];STORE.profiles=[];
  STORE.ready=false;STORE.connected=false;STORE.syncIssue=null;
  const stockCache=new Map(), received=new Set(), reported=new Set();
  // Solo los datos indispensables deben bloquear el conteo. Las colecciones nuevas
  // (sobrantes y reconteos) pueden requerir reglas actualizadas; no paralizan inventarios.
  const required=role==='supervisor'?['catalog','stock','counts','markers']:
                 role==='recount'?['catalog','recounts','recount_entries']:
                 ['catalog','counts','markers'];
  let syncTimer=null, sessionStopped=false;
  const friendly=(key,e)=>{
    const raw=String(e?.message||e||'Error de conexión');
    const desc=key==='stock'?'existencias teóricas':key==='catalog'?'catálogo':
      key==='counts'?'conteos':key==='markers'?'avance':
      key==='recounts'?'cola de reconteo':key==='recount_entries'?'registros de reconteo':
      key==='surplus'?'sobrantes':key==='profiles'?'perfiles':key;
    return (e?.code==='permission-denied'||raw.includes('permission'))?
      `Sin permiso de Firestore para ${desc}. Revisa las reglas de ese módulo. No se ha eliminado ningún conteo.`:
      `No se pudo consultar ${desc}: ${raw}`;
  };
  const setFailure=message=>{
    if(sessionStopped)return;
    clearTimeout(syncTimer);
    STORE.syncIssue=message;
    STORE.ready=false;STORE.connected=false;
    render();
  };
  const updateReady=()=>{
    if(sessionStopped||STORE.syncIssue)return;
    const ready=required.every(k=>received.has(k));
    STORE.ready=ready;STORE.connected=ready;
    if(ready)clearTimeout(syncTimer);
    scheduleRender();
  };
  syncTimer=setTimeout(()=>{
    if(sessionStopped||STORE.ready||STORE.syncIssue)return;
    const missing=required.filter(k=>!received.has(k));
    setFailure(`Firebase no terminó de responder después de 20 segundos. Falta sincronizar: ${missing.join(', ')}. Comprueba la conexión o vuelve a intentarlo.`);
  },20000);
  const watch=(key,ref,fn)=>{
    try{
      const stop=fsm.onSnapshot(ref,snap=>{
        if(sessionStopped||STORE.syncIssue)return;
        fn(snap.docs.map(d=>({id:d.id,...d.data()})));
        received.add(key);
        updateReady();
      },e=>{
        if(sessionStopped)return;
        console.error('PuntoFarma Firebase / '+key,e);
        const message=friendly(key,e);
        if(required.includes(key)){
          setFailure(message);
        }else if(!reported.has(key)){
          reported.add(key);
          notify('Módulo no disponible: '+message,'error');
        }
      });
      unsub.push(()=>{sessionStopped=true;clearTimeout(syncTimer);stop()});
    }catch(e){
      console.error('PuntoFarma Firebase / '+key,e);
      if(required.includes(key))setFailure(friendly(key,e));
      else notify(friendly(key,e),'error');
    }
  };
  watch('catalog',fsm.collection(db,'catalog'),rows=>{
    STORE.products=rows.map(p=>role==='supervisor'?{...p,...(stockCache.get(p.id)||{})}:publicProduct(p));
  });
  watch('markers',fsm.collection(db,'markers'),a=>STORE.markers=a);
  watch('recounts',fsm.collection(db,'recounts'),a=>STORE.recounts=a);
  watch('recount_entries',role==='supervisor'?fsm.collection(db,'recount_entries'):fsm.query(fsm.collection(db,'recount_entries'),fsm.where('uid','==',uid)),a=>STORE.recountEntries=a);
  watch('surplus',role==='supervisor'?fsm.collection(db,'surplus'):fsm.query(fsm.collection(db,'surplus'),fsm.where('uid','==',uid)),a=>STORE.surplus=a);
  watch('counts',role==='supervisor'?fsm.collection(db,'counts'):fsm.query(fsm.collection(db,'counts'),fsm.where('uid','==',uid)),a=>STORE.counts=a);
  if(role==='supervisor'){
    watch('stock',fsm.collection(db,'stock'),rows=>{
      stockCache.clear();rows.forEach(p=>stockCache.set(p.id,p));
      STORE.products=STORE.products.map(p=>({...p,...(stockCache.get(p.id)||{})}));
    });
    watch('profiles',fsm.collection(db,'profiles'),a=>STORE.profiles=a);
  }
 },
 async signOut(){unsub.forEach(f=>f());unsub=[];await fb.authm.signOut(fb.auth)}

function loginEmail(u){
  if(!/^[a-z0-9._-]{3,32}$/i.test(u.trim()))throw Error('Usuario: utiliza de 3 a 32 caracteres válidos.');
  return 'pfinv.'+u.trim().toLowerCase()+'@acceso.puntofarma.invalid';
}
function firebasePassword(pin){
  if(String(pin).length<4)throw Error('La clave debe contener al menos 4 caracteres.');
  return 'PFi#'+String(pin);

},240)}

function suggestedFactor(p){
 if(!p)return 1;
 const configured=Number(p.unitsPerPresentation)||1;
 if(configured>1)return configured;
 const name=String(p.name||'').toUpperCase();
 const match=name.match(/(?:\bX|×)\s*(\d{1,4})\b/);
 if(!match)return 1;
 const after=name.slice(match.index+match[0].length);
 const dosage=/(?:\bTAB(?:LETAS?)?\b|\bCOMP(?:RIMIDOS?)?\b|\bCAPS?(?:ULAS?)?\b|\bSOB(?:RES?)?\b|\bPASTILLAS?\b|\bGRAGEAS?\b|\bPERLAS?\b)/i;
 const before=name.slice(0,match.index);
 // Sólo sugerir para presentaciones farmacéuticas explícitas; nunca convertir un X100 ML.
 return dosage.test(after)||dosage.test(before) ? Number(match[1]):1;
}

function compute(){let by=new Map();for(const c of STORE.counts){let x=by.get(c.skuId)||{qty:0,entries:0,people:new Set()};x.qty+=Number(c.qty)||0;x.entries++;x.people.add(c.name);by.set(c.skuId,x)}let summary={total:STORE.products.length,touched:0,exact:0,missing:0,extra:0,unseen:0,totalTheory:0,totalPhysical:0,absDiff:0,unitMissing:0,unitExtra:0};let statuses=STORE.products.map(p=>{let x=by.get(p.id),t=Number(p.theoretical)||0,f=x?.qty||0;summary.totalTheory+=t;summary.totalPhysical+=f;summary.absDiff+=Math.abs(t-f);let st;if(!x){st='pending';summary.unseen++;if(t>0){summary.missing++;summary.unitMissing+=t}}else{summary.touched++;if(f===t){st='ok';summary.exact++}else if(f<t){st='missing';summary.missing++;summary.unitMissing+=t-f}else{st='extra';summary.extra++;summary.unitExtra+=f-t}}return {...p,physical:f,difference:f-t,status:st,entries:x?.entries||0,people:x?.people?.size||0}});summary.progress=summary.total?100*summary.touched/summary.total:0;summary.eriCodes=summary.total?100*summary.exact/summary.total:0;summary.eriUnits=summary.totalTheory?Math.max(0,100*(1-summary.absDiff/summary.totalTheory)):0;return{summary,statuses}}

function pagination(total,limit,page,kind){let end=Math.min((page+1)*limit,total),start=total?page*limit+1:0;return `<div class="pagination"><span>Mostrando ${start}–${end} de ${nfmt(total)}</span><div class="pagebtns"><button aria-label="Página anterior" data-action="page" data-kind="${kind}" data-step="-1" ${page===0?'disabled':''}>‹</button><button aria-label="Página siguiente" data-action="page" data-kind="${kind}" data-step="1" ${(page+1)*limit>=total?'disabled':''}>›</button></div></div>`}

async function parseExcel(file){let name=file.name.toLowerCase();let data;if(name.endsWith('.json')){data=JSON.parse(await file.text());if(!Array.isArray(data))throw Error('El JSON debe ser una lista de productos.');return await mapRows(data)}if(name.endsWith('.csv')){let txt=await file.text();return await mapRows(csvParse(txt))}
 if(!window.XLSX){await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(Error('No se pudo cargar el lector de Excel. Revisa tu conexión o utiliza CSV.'));document.head.appendChild(s)})}
 let wb=window.XLSX.read(await file.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];let arr=window.XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});return await mapRows(arr)
}
function csvParse(str){let rows=[],row=[],cell='',quote=false;for(let i=0;i<str.length;i++){let c=str[i];if(c==='"'){if(quote&&str[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&str[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}if(!rows.length)return[];let header=rows.shift().map(x=>x.replace(/^\uFEFF/,''));return rows.map(r=>Object.fromEntries(header.map((h,i)=>[h,r[i]])))}
function numv(x){if(typeof x==='number')return x;let v=String(x??'').trim().replace(/[$ ]/g,'');if(v.includes(',')&&!v.includes('.'))v=v.replace(',','.');else if(v.includes(',')&&v.includes('.'))v=v.replaceAll(',','');return Number(v)||0}
async function stableId(code,name){let key=`${code}|${name.toUpperCase()}`;if(crypto?.subtle){let ar=await crypto.subtle.digest('SHA-1',new TextEncoder().encode(key));return 'pf-'+[...new Uint8Array(ar)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,14)}let h=2166136261;for(const c of key)h=(h^c.charCodeAt(0))*16777619;return 'pf-'+(h>>>0).toString(16)}
async function mapRows(rows){const map=new Map();for(const row of rows){let rowObj=Object.fromEntries(Object.entries(row).map(([k,v])=>[norm(k).replace(/\s+/g,''),v]));let get=(...keys)=>{for(let k of keys){let v=rowObj[norm(k).replace(/\s+/g,'')];if(v!==undefined)return v}return''};let code=String(get('codigo','code','código','sku')||'').trim().replace(/\.0$/,'');let name=String(get('producto','name','nombre','descripcion')||'').trim();if(!name||!code)continue;let qty=numv(get('total','theoretical','stock','cantidadtotal'));let packs=numv(get('qty','packs','cajas'));let factor=numv(get('unid por presentacion','unidporpresentacion','unitsPerPresentation'))||1;if(qty===0&&packs)qty=packs*factor;let id=await stableId(code,name),p={id,code,name,category:String(get('categoria','category')||''),presentation:String(get('presentacion','presentation')||'UNIDAD'),unitsPerPresentation:factor,packs,theoretical:qty,pvpUnit:numv(get('pvp unidad','pvpUnit')),pvpTotal:numv(get('pvp total','pvpTotal')),costUnit:numv(get('pvf','costUnit')),costTotal:numv(get('pvf total','costTotal')),sourceRows:[]};if(map.has(id)){let old=map.get(id);old.theoretical+=p.theoretical;old.packs+=p.packs;old.costTotal+=p.costTotal}else map.set(id,p)}return [...map.values()]}
function exportCsv(rows,filename){if(!rows.length)return notify('No hay registros para exportar.','error');let keys=Object.keys(rows[0]),esc=s=>'"'+String(s??'').replaceAll('"','""')+'"',csv='\uFEFF'+keys.map(esc).join(',')+'\r\n'+rows.map(r=>keys.map(k=>esc(r[k])).join(',')).join('\r\n');let a=document.createElement('a'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'});a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}

let soundContext=null;
function prepareSound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!soundContext||soundContext.state==='closed')soundContext=new AC();if(soundContext.state==='suspended')soundContext.resume().catch(()=>{});return soundContext}catch{return null}}
function beep(){try{const ctx=prepareSound();if(!ctx)return;const t=ctx.currentTime+.018;for(const [freq,offset] of [[720,0],[1030,.115]]){let osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,t+offset);gain.gain.exponentialRampToValueAtTime(.16,t+offset+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+offset+.10);osc.connect(gain);gain.connect(ctx.destination);osc.start(t+offset);osc.stop(t+offset+.11)}navigator.vibrate?.(60)}catch(e){console.warn('El dispositivo no permitió emitir sonido',e)}}

   const mine=STORE.recounts.find(x=>x.status==='in_progress'&&x.assignedUid===STORE.uid);
   if(mine)throw Error('Ya tienes un código reservado. Finalízalo o libéralo primero.');
   await adapter.claimRecount(id);STATE.recountActiveId=id;notify('Código reservado para ti.');render();
 }else if(action==='release-recount'){
   const t=STORE.recounts.find(x=>x.skuId===id);if(!t)throw Error('Código no encontrado.');
   if(!confirm('¿Liberar este código? Los registros previos quedarán en el historial y no se mezclarán con el nuevo intento.'))return;
   await adapter.releaseRecount(id);if(STATE.recountActiveId===id)STATE.recountActiveId=null;notify('Código liberado.');render();
 }else if(action==='finish-recount'){
   if(STORE.role!=='recount')throw Error('Solo el colaborador asignado puede finalizar.');
   await adapter.finishRecount(id);STATE.recountActiveId=null;notify('Reconteo finalizado; enviado a Supervisión.');render();
 }else if(action==='recount-detail'){recountDetailModal(id)
 }else if(action==='select-novelty'){
   if(b.checked)STATE.recountSelection.add(id);else STATE.recountSelection.delete(id);
 }else if(action==='status-filter'){
   STATE.status=b.dataset.status;STATE.page=0;const tabs=document.getElementById('dashboard-status-tabs');
   if(tabs)tabs.querySelectorAll('.status-tab').forEach(x=>x.classList.toggle('active',x.dataset.status===STATE.status));updateTables();
 }else if(action==='queue-selected'){
   const chosen=compute().statuses.filter(p=>STATE.recountSelection.has(p.id)&&(p.status==='missing'||p.status==='extra'));
   const tasks=chosen.filter(p=>!STORE.recounts.some(x=>x.skuId===p.id));
   if(!tasks.length)throw Error('Selecciona códigos contados con faltantes o sobrantes que no estén enviados.');
   if(!confirm(`¿Enviar ${tasks.length} código(s) a reconteo?`))return;
   await adapter.queueRecounts(tasks.map(p=>({skuId:p.id,code:p.code,name:p.name,positions:[...new Set(STORE.counts.filter(c=>c.skuId===p.id).map(c=>String(c.position)))].sort((a,b)=>Number(a)-Number(b)),status:'pending',assignedUid:'',assignedName:'',claimedAt:'',createdAt:now(),attemptId:'',updatedAt:now()})));
   STATE.recountSelection.clear();notify(`${tasks.length} código(s) enviados a reconteo.`);render();
 }else if(action==='copy-filter'){
   const rows=filteredRowsCSV();if(!rows.length)throw Error('El filtro no tiene registros.');
   const col=Object.keys(rows[0]),data=[col.join('\t'),...rows.map(x=>col.map(k=>String(x[k]??'')).join('\t'))].join('\n');
   await navigator.clipboard.writeText(data);notify(`${rows.length} filas copiadas.`);
 }else if(action==='download-filter'){
   exportCsv(filteredRowsCSV(),`puntofarma_${STATE.status}_${localToday()}.csv`);
 }else if(action==='worker-tab'){STATE.workerTab=b.dataset.tab==='surplus'?'surplus':'count';render()}else if(action==='edit-surplus'){editSurplusModal(id)}else if(action==='delete-surplus'){let c=STORE.surplus.find(x=>x.id===id);if(!c)throw Error('Sobrante no encontrado.');if(STORE.role==='operator'&&c.uid!==STORE.uid)throw Error('No puedes borrar registros ajenos.');if(!confirm('¿Eliminar este sobrante manual?'))return;await adapter.deleteSurplus(id);closeModal();notify('Sobrante eliminado.');if(STORE.appMode==='demo')render()}else if(action==='test-sound'){prepareSound();beep();notify('Sonido de prueba reproducido. Comprueba el volumen del celular.')}else if(action==='back'){STATE.loginType='';render()}else if(action==='role'){STATE.loginType=b.dataset.role;render()}else if(action==='nav'){STATE.panel=b.dataset.route;STATE.page=0;render()}else if(action==='collapse'){STATE.collapsed=!STATE.collapsed;localStorage.setItem(PREFIX+'collapsed',String(STATE.collapsed));render()}else if(action==='logout'){signOut()}else if(action==='close-modal'){closeModal()}else if(action==='pick-product'){STATE.selected=id;STATE.workerQuery='';let x=document.getElementById('worker-search');if(x)x.value='';updateSuggestions();document.getElementById('worker-qty')?.focus()}else if(action==='clear-product'){STATE.selected=null;STATE.workerQuery='';updateSuggestions();document.getElementById('worker-search')?.focus()}else if(action==='page'){if(b.dataset.kind==='dash')STATE.page+=Number(b.dataset.step);else STATE.invPage+=Number(b.dataset.step);updateTables()}else if(action==='detail'){showDetail(id)}else if(action==='edit-count'){showCountEditor(id)}else if(action==='delete-count'){if(!confirm('¿Eliminar este registro de conteo? Los indicadores se actualizarán automáticamente.'))return;let c=STORE.counts.find(x=>x.id===id);if(STORE.role==='operator'&&c?.uid!==STORE.uid)throw Error('Sin permiso.');await adapter.deleteCount(id);closeModal();notify('Registro eliminado.');if(STORE.appMode==='demo')render()}
 else if(action==='edit-product'){showProductEditor(id)}else if(action==='new-product'){showProductEditor(null)}else if(action==='delete-product'){let p=STORE.products.find(x=>x.id===id);if(!confirm(`¿Eliminar ${p?.name||'este producto'} del catálogo?`))return;await adapter.deleteProduct(id);notify('Producto eliminado.');if(STORE.appMode==='demo')render()}
 else if(action==='import-modal'){importModal()}else if(action==='reset-modal'){resetModal(b.dataset.mode)}else if(action==='new-admin'){modalNewAdmin()}else if(action==='change-pass'){modalPassword(id)}else if(action==='toggle-user'){if(!confirm('¿Cambiar el estado de este acceso?'))return;await adapter.toggleUser(id);notify('Estado actualizado.');if(STORE.appMode==='demo')render()}
 else if(action==='export-surplus'){exportCsv(surplusCSV(),'puntofarma_sobrantes_manuales.csv')}else if(action==='export-counts'){exportCsv(countCSV(),'puntofarma_conteos.csv')}else if(action==='export-expiry'){exportCsv([...countCSV().filter(x=>x.caducidad),...surplusCSV()],'puntofarma_caducidades.csv')}else if(action==='export-inventory'){exportCsv(STORE.products.map(p=>({codigo:p.code,producto:p.name,categoria:p.category,presentacion:p.presentation,teorico:p.theoretical,costoTotal:p.costTotal})),'puntofarma_inventario.csv')}
 else if(action==='first-firebase'){showModal('Primer supervisor en Firebase',`<form class="form-stack" data-form="first-firebase"><div class="note">Primero debes crear el proyecto Firebase y aplicar las reglas de seguridad incluidas. El alta inicial crea la cuenta web; luego debes autorizar su UID una sola vez desde Firestore. Este paso evita que cualquier visitante se convierta en supervisor.</div><div class="field"><label>Usuario</label><input class="input" name="username" required minlength="3" pattern="[a-zA-Z0-9._-]+"></div><div class="field"><label>Nombre visible</label><input class="input" name="displayName" required></div><div class="field"><label>Contraseña</label><input class="input" name="password" type="password" minlength="6" required></div><div class="dialog-footer"><button class="btn btn-primary">Crear cuenta inicial</button></div></form>`)}
 }catch(err){notify(err.message||'Ocurrió un error.','error')}});
document.addEventListener('submit',async e=>{let form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();if(STATE.busy)return;if(['count','surplus','recount-count'].includes(form.dataset.form))prepareSound();STATE.busy=true;let btn=form.querySelector('[type=submit],button:not([type])'),fd=Object.fromEntries(new FormData(form));if(btn)btn.disabled=true;try{
 switch(form.dataset.form){
 case 'first-admin':{let name=String(fd.username||'').trim().toLowerCase();loginEmail(name);let u=await adapter.createFirst(name,String(fd.password),String(fd.displayName));STORE.user=u;appEnter('supervisor',u);notify('Supervisor configurado.');break}
 case 'admin-login':{let user=await adapter.authenticate(String(fd.username||''),String(fd.password||''));appEnter('supervisor',user);notify('Acceso autorizado.');break}
 case 'worker-login':{let name=String(fd.displayName||'').trim().replace(/\s+/g,' ');if(name.length<3)throw Error('Ingresa al menos 3 caracteres.');let u=await adapter.loginWorker(name);appEnter(STATE.loginType==='recount'?'recount':'operator',u);notify('Sesión iniciada.');break}
 case 'recount-count':{
   const task=STORE.recounts.find(t=>t.status==='in_progress'&&t.assignedUid===STORE.uid);
   if(!task||STORE.role!=='recount')throw Error('No tienes un código reservado.');
   const qty=Number(fd.qty),position=String(fd.position||'').trim(),expiry=expiryInput(fd.expiry);
   if(!Number.isSafeInteger(qty)||qty<=0)throw Error('Ingresa un número de unidades válido.');
   if(!/^\d+$/.test(position))throw Error('La posición debe contener solo números.');
   if(!expiry||!validDate(expiry))throw Error('La caducidad debe tener 4 dígitos: MMAA.');
   await adapter.saveRecountEntry({id:strId(),skuId:task.skuId,uid:STORE.uid,name:STORE.user.displayName,qty,position,expiry,createdAt:now()});
   beep();notify(`${qty} unidades guardadas en el reconteo.`);form.reset();
   if(STORE.appMode==='demo')render();
   break;
 }
 case 'count':{let p=STORE.products.find(x=>x.id===STATE.selected);if(!p){let search=String(document.getElementById('worker-search')?.value||'').trim();let exact=STORE.products.filter(x=>x.code===search||norm(x.name)===norm(search));if(exact.length===1)p=exact[0]}if(!p)throw Error('Primero selecciona un producto de la lista.');let qty=Number(fd.qty),position=String(fd.position||'').trim(),expiry=expiryInput(fd.expiry);if(fd.countMode==='boxes'){const f=Number(fd.factor);if(!Number.isSafeInteger(f)||f<=0)throw Error('Indica las unidades que trae cada caja.');qty=qty*f;}if(!Number.isSafeInteger(qty)||qty<=0)throw Error('La cantidad debe ser un número entero mayor a cero.');if(!/^\d+$/.test(position))throw Error('La posición debe contener solamente números.');if(!expiry||!validDate(expiry))throw Error('Escribe la caducidad en 4 números. Ejemplo: 0826 = Agosto/2026.');let c={id:strId(),skuId:p.id,uid:STORE.uid,name:STORE.user.displayName,qty,position,expiry,createdAt:now()};await adapter.saveCount(c);STATE.selected=null;STATE.workerQuery='';beep();notify(`${qty} unidad(es) registradas correctamente.`);if(STORE.appMode==='demo'){render()}else {form.reset();updateSuggestions();const prev=document.getElementById('expiry-preview');if(prev)prev.textContent='0826 = Agosto/2026';updateUnitControls()};if(window.matchMedia?.('(hover:hover) and (pointer:fine)').matches)document.getElementById('worker-search')?.focus();else document.activeElement?.blur?.();break}
 case 'surplus':{let code=String(fd.code||'').trim(),productName=String(fd.productName||'').trim(),qty=Number(fd.qty),expiry=expiryInput(fd.expiry);if(!code||!productName)throw Error('Completa código y nombre del sobrante.');if(!Number.isSafeInteger(qty)||qty<=0)throw Error('La cantidad debe ser un entero mayor a cero.');if(!expiry||!validDate(expiry))throw Error('Caducidad inválida. Ejemplo: 0826.');await adapter.saveSurplus({id:strId(),code,productName,qty,expiry,uid:STORE.uid,name:STORE.user.displayName,createdAt:now()});beep();notify('Sobrante reportado al supervisor.');if(STORE.appMode==='demo')render();else form.reset();break}
 case 'edit-surplus':{const id=String(fd.id),c=STORE.surplus.find(x=>x.id===id);if(!c||(STORE.role==='operator'&&c.uid!==STORE.uid))throw Error('No tienes permiso para modificar ese sobrante.');const code=String(fd.code||'').trim(),productName=String(fd.productName||'').trim(),qty=Number(fd.qty),expiry=expiryInput(fd.expiry);if(!code||!productName||!Number.isSafeInteger(qty)||qty<=0||!validDate(expiry))throw Error('Revisa código, nombre, unidades y caducidad.');await adapter.editSurplus(id,{code,productName,qty,expiry});closeModal();notify('Sobrante actualizado.');if(STORE.appMode==='demo')render();break}
 case 'edit-count':{let id=String(fd.id),c=STORE.counts.find(x=>x.id===id);if(!c||STORE.role==='operator'&&c.uid!==STORE.uid)throw Error('Sin permiso para editar.');let qty=Number(fd.qty),pos=String(fd.position||'').trim(),expiry=expiryInput(fd.expiry);if(!Number.isSafeInteger(qty)||qty<=0||!/^\d+$/.test(pos)||!expiry||!validDate(expiry))throw Error('Cantidad, posición o caducidad inválida. Usa MMAA, ejemplo 0826.');await adapter.editCount(id,{qty,position:pos,expiry});closeModal();notify('Conteo actualizado.');if(STORE.appMode==='demo')render();break}
 case 'product-editor':{let name=String(fd.name||'').trim(),code=String(fd.code||'').trim(),theoretical=Number(fd.theoretical);if(!name||!code||!Number.isSafeInteger(theoretical)||theoretical<0)throw Error('Producto, código o cantidad inválidos.');let id=String(fd.id||'');let p=STORE.products.find(x=>x.id===id);let updates={name,code,category:String(fd.category||''),presentation:String(fd.presentation||''),unitsPerPresentation:Number(fd.unitsPerPresentation||1),theoretical,costTotal:Math.max(0,Number(fd.costTotal||0))};if(p)await adapter.updateProduct(id,updates);else{let newId=await stableId(code,name);if(STORE.products.some(x=>x.id===newId))throw Error('Este producto ya existe en el catálogo.');await adapter.upsertProducts([{id:newId,packs:0,pvpUnit:0,pvpTotal:0,costUnit:0,sourceRows:[],...updates}])}closeModal();notify('Producto guardado.');if(STORE.appMode==='demo')render();break}
 case 'new-admin':{let uname=String(fd.username||'').trim().toLowerCase();loginEmail(uname);let p=await adapter.createUser(uname,String(fd.password),String(fd.displayName||'').trim());if(STORE.appMode==='demo')STORE.profiles.find(x=>x.id===p.id);closeModal();notify('Supervisor creado.');if(STORE.appMode==='demo')render();break}
 case 'password':{if(String(fd.password||'').length<4)throw Error('La contraseña debe tener 4 caracteres o más.');await adapter.changePassword(String(fd.id),String(fd.password));closeModal();notify('Contraseña actualizada.');break}
 case 'reset-data':{
   const mode=String(fd.mode||''), expected={counts:'BORRAR CONTEOS',catalog:'BORRAR INVENTARIO',all:'BORRAR TODO'}[mode];
   if(!expected||String(fd.confirmText||'').trim()!==expected)throw Error('La frase de confirmación no coincide.');
   if(STORE.role!=='supervisor')throw Error('Solo Supervisión puede reiniciar el inventario.');
   if(!confirm('Esta acción elimina datos de Firebase permanentemente. ¿Confirmas que deseas continuar?'))break;
   notify('Eliminando datos en Firebase…');
   await adapter.resetData(mode);closeModal();notify('Eliminación completada en Firebase.');
   if(STORE.appMode==='demo')render();
   break;
 }
 case 'import':{let file=form.querySelector('input[type="file"]')?.files?.[0];if(!file)throw Error('Selecciona el archivo.');notify('Leyendo archivo…');let products=await parseExcel(file);if(!products.length)throw Error('No se detectaron productos con código y nombre.');await adapter.upsertProducts(products);closeModal();notify(`${products.length} productos importados/actualizados; conteos conservados.`);if(STORE.appMode==='demo')render();break}
 case 'first-firebase':{let initial=await adapter.createFirst(String(fd.username||'').trim().toLowerCase(),String(fd.password||''),String(fd.displayName||''));showModal('Activa tu primer supervisor',`<div class="note">Cuenta creada. Para impedir que cualquier visitante se convierta en supervisor, debes autorizar este UID una sola vez en Firebase → Firestore.</div><div class="field" style="margin-top:15px"><label>UID de Authentication</label><input class="input" readonly value="${escapeHtml(initial.id)}" onclick="this.select()"></div><div class="note">Crea <strong>profiles / ${escapeHtml(initial.id)}</strong> con los campos:<br><code>role</code> = supervisor<br><code>username</code> = ${escapeHtml(initial.username)}<br><code>displayName</code> = ${escapeHtml(initial.displayName)}<br><code>active</code> = true (booleano).<br><br>Después vuelve e inicia sesión con tu usuario y contraseña.</div>`);break}
 }
 }catch(err){notify(err?.message||'No se pudo guardar.','error')}finally{STATE.busy=false;if(btn&&btn.isConnected)btn.disabled=false}});
window.addEventListener('storage',event=>{if(STORE.appMode==='demo'&&event.key?.startsWith(PREFIX)){loadLocalData();if(STATE.screen==='app')render()}});
async function bootstrap(){
 STORE.appMode='firebase';
 const cfg=window.PF_FIREBASE_CONFIG;
 if(!cfg || !cfg.apiKey || !cfg.authDomain || !cfg.projectId || !cfg.appId){
  app.innerHTML='<main class="boot"><h2>Firebase pendiente de configuración</h2><p>Conecta el proyecto Firebase nuevo antes de utilizar PuntoFarma Inventory en línea.</p></main>';
  return;
 }
 const connected=await initFirebase();
 if(connected!==true)return;
 STORE.products=[];STORE.counts=[];STORE.surplus=[];STORE.markers=[];STORE.recounts=[];STORE.recountEntries=[];STORE.profiles=[];
 render();
}
bootstrap();
})();

  </script>
