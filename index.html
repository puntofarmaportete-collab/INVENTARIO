function adminContent(){return STATE.panel==='inventory'?inventoryMarkup():STATE.panel==='expiry'?expiryMarkup():STATE.panel==='users'?usersMarkup():dashboardMarkup()}
const header=(title,sub,actions='')=>`<div class="page-title"><div><h1>${title}</h1></div>${actions?`<div class="page-actions">${actions}</div>`:''}</div>`;
function compute(){let by=new Map();for(const c of STORE.counts){let x=by.get(c.skuId)||{qty:0,entries:0,people:new Set()};x.qty+=Number(c.qty)||0;x.entries++;x.people.add(c.name);by.set(c.skuId,x)}let summary={total:STORE.products.length,touched:0,exact:0,missing:0,extra:0,unseen:0,totalTheory:0,totalPhysical:0,absDiff:0,unitMissing:0,unitExtra:0};let statuses=STORE.products.map(p=>{let x=by.get(p.id),t=Number(p.theoretical)||0,f=x?.qty||0;summary.totalTheory+=t;summary.totalPhysical+=f;summary.absDiff+=Math.abs(t-f);let st;if(!x){st='pending';summary.unseen++;if(t>0){summary.missing++;summary.unitMissing+=t}}else{summary.touched++;if(f===t){st='ok';summary.exact++}else if(f<t){st='missing';summary.missing++;summary.unitMissing+=t-f}else{st='extra';summary.extra++;summary.unitExtra+=f-t}}return {...p,physical:f,difference:f-t,status:st,entries:x?.entries||0,people:x?.people?.size||0}});summary.progress=summary.total?100*summary.touched/summary.total:0;summary.eriCodes=summary.total?100*summary.exact/summary.total:0;summary.eriUnits=summary.totalTheory?Math.max(0,100*(1-summary.absDiff/summary.totalTheory)):0;return{summary,statuses}}
function kpi(label,val,icon,accent='',sub=''){return `<div class="surface kpi"><div class="kpi-label"><span class="mini-icon ${accent}">${I(icon)}</span>${label}</div><span class="stat-value ${accent==='green'?'status-green':accent==='red'?'status-red':accent==='amber'?'status-amber':''}">${val}</span>${sub?`<div class="kpi-sub">${sub}</div>`:''}</div>`}
function dashboardMarkup(){let {summary:s,statuses}=compute(),last=[...STORE.counts].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).slice(0,6);return `${header('Control de inventario','Seguimiento integral de la operación, diferencias y conteos en tiempo real.',`<button class="btn btn-outline" data-action="export-counts">${I('download')} Exportar conteos</button>`)}<div class="kpi-grid">${kpi('Referencias',nfmt(s.total),'inventory')}${kpi('Códigos contados',nfmt(s.touched),'check','green',`${nfmt(s.unseen)} pendientes`)}${kpi('Cuadrados',nfmt(s.exact),'shield','green')}${kpi('Faltantes',nfmt(s.missing),'alert','red',`${nfmt(s.unseen)} sin tocar incluidos`)}${kpi('Sobrantes',nfmt(s.extra),'upload','amber',`${nfmt(s.unitExtra)} unidades de más`)}${kpi('ERI · códigos',pct(s.eriCodes),'dashboard')}${kpi('ERI · unidades',pct(s.eriUnits),'dashboard')}${kpi('Unidades contadas',nfmt(s.totalPhysical),'inventory')}</div><div class="dashboard-row"><div class="surface pad"><div class="surface-head"><div><h3 class="surface-title">Avance del inventario</h3></div><span class="pill green"><span class="dot"></span> ${pct(s.progress)}</span></div><div class="progress-top"><strong>${nfmt(s.touched)} de ${nfmt(s.total)} SKU</strong><span class="small muted">${nfmt(s.unseen)} pendientes</span></div><div class="progress-track"><div style="width:${s.progress}%"></div></div><div class="progress-desc"><span>Inventario iniciado</span><span>Conteo completo</span></div><div class="eri-wrap" style="margin-top:21px"><div class="donut" style="--pct:${s.eriCodes}"><div><strong>${Math.round(s.eriCodes)}%</strong><small>ERI CÓDIGOS</small></div></div><div class="small-metrics"><div class="small-metric"><span>Unidades teóricas</span><b>${nfmt(s.totalTheory)}</b></div><div class="small-metric"><span>Unidades físicas</span><b>${nfmt(s.totalPhysical)}</b></div><div class="small-metric"><span>Diferencia absoluta</span><b>${nfmt(s.absDiff)}</b></div><div class="small-metric"><span>Faltante físico</span><b class="status-red">${nfmt(s.unitMissing)} und.</b></div></div></div></div><div class="surface pad"><div class="surface-head"><div><h3 class="surface-title">Conteos en vivo</h3></div><span class="pill green"><span class="dot"></span> Actualizado</span></div><div class="activity-list">${last.length?last.map(c=>{let p=STORE.products.find(x=>x.id===c.skuId);return `<div class="activity-row">${avatar(c.name)}<div class="activity-copy"><strong>${escapeHtml(c.name)}</strong><small>${escapeHtml(p?.name||'Producto eliminado')} · Caja ${escapeHtml(c.position)}</small></div><div class="activity-q">+${nfmt(c.qty)}</div></div>`}).join(''):`<div class="empty">Aún no hay conteos. Los registros aparecerán aquí automáticamente.</div>`}</div></div></div><div class="dashboard-bottom"><section class="surface pad"><div class="surface-head"><div><h3 class="surface-title">Conciliación y diferencias</h3></div></div><div class="toolbar" style="margin-bottom:13px"><div class="search-wrap">${I('search')}<input class="input" id="dashboard-search" placeholder="Buscar por código, producto, categoría o cualquier palabra…" value="${escapeHtml(STATE.query)}"></div><select class="select" id="dashboard-status"><option value="all">Todos los estados</option><option value="pending" ${STATE.status==='pending'?'selected':''}>Sin contar</option><option value="missing" ${STATE.status==='missing'?'selected':''}>Faltantes</option><option value="extra" ${STATE.status==='extra'?'selected':''}>Sobrantes</option><option value="ok" ${STATE.status==='ok'?'selected':''}>Cuadrados</option></select></div><div id="dashboard-table">${dashboardTable(statuses)}</div></section></div>`}
function matches(p,q,extra=''){const tokens=norm(q).split(/\s+/).filter(Boolean);if(!tokens.length)return true;const blob=norm([p.code,p.name,p.category,p.presentation,p.sourceRows?.join(' '),extra].join(' '));return tokens.every(t=>blob.includes(t))}
const statusLabel={pending:'Sin contar',missing:'Faltante',extra:'Sobrante',ok:'Cuadrado'};
function dashboardTable(rows){const search=rows.filter(p=>matches(p,STATE.query,statusLabel[p.status])&&(STATE.status==='all'||p.status===STATE.status));const limit=14,max=Math.max(1,Math.ceil(search.length/limit));STATE.page=Math.max(0,Math.min(STATE.page,max-1));let page=search.slice(STATE.page*limit,(STATE.page+1)*limit);return `<div class="table-scroll"><table class="data-table"><thead><tr><th>Producto / código</th><th>Categoría</th><th class="right">Teórico</th><th class="right">Físico</th><th class="right">Dif.</th><th>Estado</th><th class="right">Detalle</th></tr></thead><tbody>${page.length?page.map(p=>`<tr><td><div class="product-name" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div><span class="product-code">${escapeHtml(p.code)}</span></td><td>${escapeHtml(p.category||'Sin categoría')}</td><td class="right bold">${nfmt(p.theoretical)}</td><td class="right">${nfmt(p.physical)}</td><td class="right bold ${p.difference<0?'status-red':p.difference>0?'status-amber':''}">${p.difference>0?'+':''}${nfmt(p.difference)}</td><td><span class="state ${p.status}">${statusLabel[p.status]}</span></td><td class="right"><button title="Ver registros y cajas" class="btn btn-outline btn-sm" data-action="detail" data-id="${p.id}">${I('eye')}</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty">No se encontraron resultados.</td></tr>`}</tbody></table></div>${pagination(search.length,limit,STATE.page,'dash')}`}
function pagination(total,limit,page,kind){let end=Math.min((page+1)*limit,total),start=total?page*limit+1:0;return `<div class="pagination"><span>Mostrando ${start}–${end} de ${nfmt(total)}</span><div class="pagebtns"><button aria-label="Página anterior" data-action="page" data-kind="${kind}" data-step="-1" ${page===0?'disabled':''}>‹</button><button aria-label="Página siguiente" data-action="page" data-kind="${kind}" data-step="1" ${(page+1)*limit>=total?'disabled':''}>›</button></div></div>`}
function inventoryMarkup(){return `${header('Mi inventario','Administración del catálogo teórico y sus existencias.',`<button class="btn btn-primary" data-action="import-modal">${I('upload')} Importar Excel</button><button class="btn btn-outline" data-action="new-product">${I('plus')} Nuevo producto</button>`)}<div class="kpi-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">${kpi('Referencias',nfmt(STORE.products.length),'inventory')}${kpi('Unidades teóricas',nfmt(STORE.products.reduce((a,p)=>a+(Number(p.theoretical)||0),0)),'database')}${kpi('Costo declarado',money(STORE.products.reduce((a,p)=>a+(Number(p.costTotal)||0),0)),'dashboard')}</div><section class="surface pad"><div class="surface-head"><div><h3 class="surface-title">Catálogo de productos</h3></div><button class="btn btn-outline btn-sm" data-action="export-inventory">${I('download')} CSV</button></div><div class="search-wrap" style="margin-bottom:13px">${I('search')}<input class="input" id="inventory-search" value="${escapeHtml(STATE.invQuery)}" placeholder="Buscar en todo el inventario…"></div><div id="inventory-table">${inventoryTable()}</div></section>`}
function inventoryTable(){let rows=STORE.products.filter(p=>matches(p,STATE.invQuery));const lim=15,max=Math.max(1,Math.ceil(rows.length/lim));STATE.invPage=Math.max(0,Math.min(STATE.invPage,max-1));return `<div class="table-scroll"><table class="data-table"><thead><tr><th>Producto / código</th><th>Categoría</th><th>Presentación</th><th class="right">Teórico</th><th class="right">Costo total</th><th class="right">Acciones</th></tr></thead><tbody>${rows.slice(STATE.invPage*lim,(STATE.invPage+1)*lim).map(p=>`<tr><td><div class="product-name" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div><span class="product-code">${escapeHtml(p.code)}</span></td><td>${escapeHtml(p.category||'Sin categoría')}</td><td>${escapeHtml(p.presentation||'—')}</td><td class="right bold">${nfmt(p.theoretical)}</td><td class="right">${money(p.costTotal)}</td><td><div class="actions-cell"><button class="btn btn-outline btn-icon" title="Editar" data-action="edit-product" data-id="${p.id}">${I('edit')}</button><button class="btn btn-danger btn-icon" title="Eliminar" data-action="delete-product" data-id="${p.id}">${I('trash')}</button></div></td></tr>`).join('')||`<tr><td colspan="6" class="empty">No hay coincidencias.</td></tr>`}</tbody></table></div>${pagination(rows.length,lim,STATE.invPage,'inv')}`}
function expiryMarkup(){let c=STORE.counts.map(x=>({...x,product:STORE.products.find(p=>p.id===x.skuId)})).filter(x=>x.expiry&&validDate(x.expiry));const expir=c.filter(x=>daysTo(x.expiry)<0),d30=c.filter(x=>daysTo(x.expiry)>=0&&daysTo(x.expiry)<=30),d60=c.filter(x=>daysTo(x.expiry)>30&&daysTo(x.expiry)<=60),d90=c.filter(x=>daysTo(x.expiry)>60&&daysTo(x.expiry)<=90);let filtered=c.filter(x=>(STATE.expiryRange==='all'||(STATE.expiryRange==='expired'&&daysTo(x.expiry)<0)||(STATE.expiryRange==='30'&&daysTo(x.expiry)>=0&&daysTo(x.expiry)<=30)||(STATE.expiryRange==='60'&&daysTo(x.expiry)>30&&daysTo(x.expiry)<=60)||(STATE.expiryRange==='90'&&daysTo(x.expiry)>60&&daysTo(x.expiry)<=90))&&matches(x.product||{},STATE.expiryQuery,[x.position,x.expiry,x.name].join(' '))).sort((a,b)=>a.expiry.localeCompare(b.expiry));return `${header('Caducidades','Control de fechas de vencimiento a partir de los conteos físicos registrados.',`<button class="btn btn-outline" data-action="export-expiry">${I('download')} Exportar reporte</button>`)}<div class="kpi-grid">${kpi('Vencidos',nfmt(expir.reduce((a,x)=>a+Number(x.qty),0)),'alert','red',`${expir.length} registros`)}${kpi('Próx. 30 días',nfmt(d30.reduce((a,x)=>a+Number(x.qty),0)),'clock','amber',`${d30.length} registros`)}${kpi('Entre 31 y 60',nfmt(d60.reduce((a,x)=>a+Number(x.qty),0)),'calendar','','Unidades')}${kpi('Entre 61 y 90',nfmt(d90.reduce((a,x)=>a+Number(x.qty),0)),'calendar','','Unidades')}</div><section class="surface pad"><div class="surface-head"><div><h3 class="surface-title">Vencimientos por caja</h3></div></div><div class="toolbar" style="margin-bottom:13px"><div class="search-wrap">${I('search')}<input class="input" id="expiry-search" placeholder="Buscar producto, código, caja o colaborador…" value="${escapeHtml(STATE.expiryQuery)}"></div><select class="select" id="expiry-range"><option value="all">Todas las fechas</option><option value="expired" ${STATE.expiryRange==='expired'?'selected':''}>Vencidos</option><option value="30" ${STATE.expiryRange==='30'?'selected':''}>0–30 días</option><option value="60" ${STATE.expiryRange==='60'?'selected':''}>31–60 días</option><option value="90" ${STATE.expiryRange==='90'?'selected':''}>61–90 días</option></select></div><div id="expiry-table">${expiryTable(filtered)}</div></section>`}
function expiryTable(rows){return `<div class="table-scroll"><table class="data-table"><thead><tr><th>Producto / código</th><th>Caja</th><th class="right">Cantidad</th><th>Caducidad</th><th>Estado</th><th>Colaborador</th><th class="right">Acciones</th></tr></thead><tbody>${rows.slice(0,120).map(c=>{let days=daysTo(c.expiry),cls=days<0?'missing':days<=30?'extra':'ok';return `<tr><td><div class="product-name" title="${escapeHtml(c.product?.name||'Producto no encontrado')}">${escapeHtml(c.product?.name||'Producto no encontrado')}</div><span class="product-code">${escapeHtml(c.product?.code||'—')}</span></td><td>${escapeHtml(c.position)}</td><td class="right bold">${nfmt(c.qty)}</td><td>${formatDate(c.expiry)}</td><td><span class="state ${cls}">${days<0?'Vencido':days===0?'Vence hoy':days+' días'}</span></td><td>${escapeHtml(c.name)}</td><td class="right"><button class="btn btn-outline btn-icon" title="Editar conteo" data-action="edit-count" data-id="${c.id}">${I('edit')}</button> <button class="btn btn-danger btn-icon" title="Borrar conteo" data-action="delete-count" data-id="${c.id}">${I('trash')}</button></td></tr>`}).join('')||`<tr><td class="empty" colspan="7">Sin registros para este filtro.</td></tr>`}</tbody></table></div>${rows.length>120?`<p class="small muted" style="margin-top:12px">Se muestran los primeros 120 registros. Utiliza el buscador o exporta el reporte completo.</p>`:''}`}
function usersMarkup(){let arr=STORE.profiles.filter(p=>p.role==='supervisor');return `${header('Configuración','',`<button class="btn btn-primary" data-action="new-admin">${I('plus')} Crear usuario</button>`)}<section class="surface pad"><div class="surface-head"><div><h3 class="surface-title">Usuarios de Supervisión</h3></div><span class="pill">${arr.length} usuarios</span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Nombre</th><th>Usuario</th><th>Estado</th><th class="right">Acciones</th></tr></thead><tbody>${arr.map(p=>`<tr><td><div style="display:flex;align-items:center;gap:9px">${avatar(p.displayName)}<strong>${escapeHtml(p.displayName||p.username)}</strong></div></td><td>${escapeHtml(p.username.toUpperCase())}</td><td><span class="state ${p.active===false?'missing':'ok'}">${p.active===false?'Inactivo':'Activo'}</span></td><td><div class="actions-cell"><button class="btn btn-outline btn-sm" data-action="edit-admin" data-id="${p.id}" title="Modificar usuario">${I('edit')} Editar</button><button class="btn btn-outline btn-sm" data-action="change-pass" data-id="${p.id}" title="Cambiar contraseña">${I('lock')} Clave</button><button class="btn ${p.active===false?'btn-soft':'btn-danger'} btn-sm" data-action="toggle-user" data-id="${p.id}" ${p.id===STORE.uid?'disabled':''}>${p.active===false?'Activar':'Desactivar'}</button></div></td></tr>`).join('')}</tbody></table></div></section><section class="surface pad" style="margin-top:16px"><h3 class="surface-title">Almacenamiento local</h3><p class="muted small" style="margin-top:10px">Los usuarios, contraseñas y conteos se guardan solamente en este navegador. No se sincronizan con otros celulares. Para operar en equipo necesitaremos activar autenticación segura y permisos en el servidor.</p></section>`}
function workerMarkup(){let allowedIds=new Set(STORE.products.map(p=>p.id)),global=new Set(STORE.markers.map(x=>x.skuId).filter(id=>allowedIds.has(id))).size,total=STORE.products.length,progress=total?100*global/total:0,my=STORE.counts.filter(x=>x.uid===STORE.uid),qty=my.reduce((a,x)=>a+Number(x.qty),0);return `<div class="worker-shell"><header class="worker-header">${logo()}<div style="display:flex;align-items:center;gap:8px">${badgeConnection()}<button class="btn btn-outline btn-icon" title="Salir" data-action="logout">${I('exit')}</button></div></header><div class="worker-welcome"><span style="font-size:11px;letter-spacing:1.2px;opacity:.84;font-weight:800">CONTEO FÍSICO · PUNTOFARMA</span><h2>¡Hola, ${escapeHtml(STORE.user.displayName)}!</h2><div class="worker-metrics"><div><small>SKU contados</small><strong>${nfmt(global)}</strong></div><div><small>SKU pendientes</small><strong>${nfmt(Math.max(0,total-global))}</strong></div><div><small>Mis registros</small><strong>${nfmt(my.length)}</strong></div></div><div class="worker-progress"><div style="width:${progress}%"></div></div><div style="display:flex;justify-content:space-between;margin-top:7px;font-size:11px"><span>Avance general</span><b>${pct(progress)}</b></div></div><div class="worker-cols"><section class="surface count-form"><div class="surface-head"><div><h3 class="surface-title">Nuevo conteo</h3></div><span class="mini-icon green">${I('inventory')}</span></div><form id="count-form" data-form="count" class="form-stack"><div class="field"><label>Producto o código *</label><div class="search-wrap">${I('search')}<input id="worker-search" class="input" autocomplete="off" value="${escapeHtml(STATE.workerQuery)}" placeholder="Ej. paracetamol, Eutirox, 75012…"></div><div id="suggestions">${searchSuggestions()}</div><div id="selected-product">${selectedMarkup()}</div></div><div class="form-row"><div class="field"><label>Cantidad física *</label><input class="input" type="number" min="1" step="1" name="qty" id="worker-qty" placeholder="0" inputmode="numeric" required></div><div class="field"><label>Número de caja *</label><input class="input" type="text" name="position" id="worker-position" placeholder="01, 02, 125…" inputmode="numeric" pattern="[0-9]+" required></div></div><div class="field"><label>Caducidad *</label><input class="input" type="date" id="worker-expiry" name="expiry" required></div><button class="btn btn-primary btn-block" type="submit">${I('check')} Guardar conteo ${I('sound')}</button></form></section><section class="surface pad"><div class="surface-head"><div><h3 class="surface-title">Mis registros</h3></div><span class="pill">${nfmt(qty)} und.</span></div><div class="my-counts">${my.length?my.slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).slice(0,35).map(c=>{let p=STORE.products.find(x=>x.id===c.skuId);return `<div class="my-count-row">${I('check','status-green')}<div class="text"><strong>${escapeHtml(p?.name||'Producto')}</strong><small>${escapeHtml(p?.code||'')} · Caja ${escapeHtml(c.position)} · ${formatDate(c.expiry)}</small><div style="display:flex;gap:6px;margin-top:9px"><button class="btn btn-outline btn-sm" data-action="edit-count" data-id="${c.id}">${I('edit')} Editar</button><button class="btn btn-danger btn-sm" data-action="delete-count" data-id="${c.id}">${I('trash')} Borrar</button></div></div><div class="amount">${nfmt(c.qty)}</div></div>`}).join(''):`<div class="empty" style="padding-top:32px">${I('inventory')}<p style="margin-top:8px">Aquí aparecerán tus productos registrados.</p></div>`}</div></section></div></div>`}
function searchSuggestions(){const q=STATE.workerQuery.trim();if(!q||STATE.selected)return'';let found=STORE.products.filter(p=>matches(p,q)).slice(0,7);return `<div class="suggestions">${found.length?found.map(p=>`<button type="button" class="suggestion" data-action="pick-product" data-id="${p.id}"><strong>${escapeHtml(p.name)}</strong><small>${escapeHtml(p.code)} · ${escapeHtml(p.presentation||p.category||'Sin categoría')}</small></button>`).join(''):`<div class="empty">Sin coincidencias. Consulta al supervisor si el producto no está en el catálogo.</div>`}</div>`}
function selectedMarkup(){let p=STORE.products.find(x=>x.id===STATE.selected);return p?`<div class="selected-prod"><div>${I('check','status-green')} <strong>${escapeHtml(p.name)}</strong><small>${escapeHtml(p.code)} · ${escapeHtml(p.presentation||'')}</small></div><button class="btn btn-outline btn-icon" type="button" data-action="clear-product" title="Cambiar producto">${I('close')}</button></div>`:''}
function updateSuggestions(){let x=document.getElementById('suggestions'),p=document.getElementById('selected-product');if(x)x.innerHTML=searchSuggestions();if(p)p.innerHTML=selectedMarkup()}
function updateTables(){if(STATE.panel==='dashboard'){let el=document.getElementById('dashboard-table');if(el)el.innerHTML=dashboardTable(compute().statuses)}if(STATE.panel==='inventory'){let el=document.getElementById('inventory-table');if(el)el.innerHTML=inventoryTable()}if(STATE.panel==='expiry'){let el=document.getElementById('expiry-table');if(el){const r=STORE.counts.map(x=>({...x,product:STORE.products.find(p=>p.id===x.skuId)})).filter(x=>x.expiry&&validDate(x.expiry)&&(STATE.expiryRange==='all'||(STATE.expiryRange==='expired'&&daysTo(x.expiry)<0)||(STATE.expiryRange==='30'&&daysTo(x.expiry)>=0&&daysTo(x.expiry)<=30)||(STATE.expiryRange==='60'&&daysTo(x.expiry)>30&&daysTo(x.expiry)<=60)||(STATE.expiryRange==='90'&&daysTo(x.expiry)>60&&daysTo(x.expiry)<=90))&&matches(x.product||{},STATE.expiryQuery,[x.position,x.expiry,x.name].join(' '))).sort((a,b)=>a.expiry.localeCompare(b.expiry));el.innerHTML=expiryTable(r)}}}
function showModal(title,body,footer='',subtitle=''){let el=document.getElementById('modal-layer');el.innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><div class="dialog-head"><div><h2>${title}</h2>${subtitle?`<p class="dialog-sub">${subtitle}</p>`:''}</div><button class="btn btn-outline btn-icon" data-action="close-modal" aria-label="Cerrar">${I('close')}</button></div>${body}${footer?`<div class="dialog-footer">${footer}</div>`:''}</div>`}
function closeModal(){document.getElementById('modal-layer').innerHTML=''}
function showProductEditor(id){let p=STORE.products.find(x=>x.id===id)||{id:'',code:'',name:'',category:'',presentation:'UNIDAD',theoretical:0,costUnit:0,costTotal:0,unitsPerPresentation:1,packs:1,pvpUnit:0,pvpTotal:0};showModal(id?'Editar producto':'Nuevo producto',`<form class="form-stack" data-form="product-editor"><input name="id" value="${escapeHtml(p.id)}" type="hidden"><div class="field"><label>Descripción del producto</label><input class="input" name="name" value="${escapeHtml(p.name)}" required></div><div class="form-row"><div class="field"><label>Código de barras</label><input class="input" name="code" value="${escapeHtml(p.code)}" required></div><div class="field"><label>Categoría</label><input class="input" name="category" value="${escapeHtml(p.category)}"></div></div><div class="form-row"><div class="field"><label>Stock teórico (unidades)</label><input class="input" type="number" step="1" min="0" name="theoretical" value="${p.theoretical}" required></div><div class="field"><label>Costo total ($)</label><input class="input" type="number" step="0.01" min="0" name="costTotal" value="${p.costTotal}"></div></div><div class="form-row"><div class="field"><label>Presentación</label><input class="input" name="presentation" value="${escapeHtml(p.presentation)}"></div><div class="field"><label>Unidades por presentación</label><input class="input" type="number" name="unitsPerPresentation" min="1" value="${p.unitsPerPresentation}"></div></div><div class="dialog-footer"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">${I('check')} Guardar producto</button></div></form>`);}
function showCountEditor(id){let c=STORE.counts.find(x=>x.id===id);if(!c||STORE.role==='operator'&&c.uid!==STORE.uid)return notify('No tienes permiso para editar ese registro.','error');const p=STORE.products.find(x=>x.id===c.skuId);showModal('Modificar conteo',`<form class="form-stack" data-form="edit-count"><input type="hidden" name="id" value="${escapeHtml(c.id)}"><div class="note"><strong>${escapeHtml(p?.name||'Producto')}</strong><br>${escapeHtml(p?.code||'')} · Registrado por ${escapeHtml(c.name)}</div><div class="form-row"><div class="field"><label>Cantidad *</label><input type="number" name="qty" class="input" min="1" step="1" required value="${c.qty}"></div><div class="field"><label>Caja *</label><input name="position" class="input" required inputmode="numeric" pattern="[0-9]+" value="${escapeHtml(c.position)}"></div></div><div class="field"><label>Caducidad *</label><input type="date" name="expiry" class="input" required value="${c.expiry}"></div><div class="dialog-footer"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button class="btn btn-primary" type="submit">Guardar cambios</button></div></form>`)}
function showDetail(id){let p=STORE.products.find(x=>x.id===id);if(!p)return;let cs=STORE.counts.filter(c=>c.skuId===id).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));let total=cs.reduce((a,x)=>a+Number(x.qty),0);showModal('Detalle de producto',`<div class="note"><strong>${escapeHtml(p.name)}</strong><br>${escapeHtml(p.code)} · ${escapeHtml(p.category||'Sin categoría')}</div><div class="form-row" style="margin:15px 0"><div class="compact-stat"><span>Teórico</span><strong>${nfmt(p.theoretical)}</strong></div><div class="compact-stat"><span>Físico</span><strong>${nfmt(total)}</strong></div></div><h3 class="section-label">Registros por caja</h3><div class="table-scroll"><table class="data-table"><thead><tr><th>Colaborador</th><th>Caja</th><th>Caducidad</th><th class="right">Und.</th><th></th></tr></thead><tbody>${cs.length?cs.map(c=>`<tr><td>${escapeHtml(c.name)}</td><td>${escapeHtml(c.position)}</td><td>${formatDate(c.expiry)}</td><td class="right">${nfmt(c.qty)}</td><td><button class="btn btn-outline btn-icon" data-action="edit-count" data-id="${c.id}">${I('edit')}</button> <button class="btn btn-danger btn-icon" data-action="delete-count" data-id="${c.id}">${I('trash')}</button></td></tr>`).join(''):`<tr><td colspan="5" class="empty">Este código no registra conteos.</td></tr>`}</tbody></table></div>`);}
function modalNewAdmin(){showModal('Nuevo usuario',`<form class="form-stack" data-form="new-admin"><div class="field"><label>Nombre para mostrar</label><input class="input" name="displayName" placeholder="Nombre y apellido" required></div><div class="field"><label>Usuario de ingreso</label><input class="input" name="username" placeholder="ej. supervisor2" required minlength="3" pattern="[a-zA-Z0-9._-]+"></div><div class="field"><label>Contraseña</label><input class="input" type="password" name="password" required minlength="4" placeholder="Contraseña"></div><div class="dialog-footer"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button class="btn btn-primary" type="submit">Crear usuario</button></div></form>`)}
function modalPassword(id){let p=STORE.profiles.find(x=>x.id===id);if(!p)return;showModal('Modificar contraseña',`<form data-form="password" class="form-stack"><input type="hidden" name="id" value="${escapeHtml(id)}"><div class="note">Usuario: <strong>${escapeHtml(p.username.toUpperCase())}</strong></div><div class="field"><label>Nueva contraseña</label><input class="input" type="password" required minlength="4" name="password" autocomplete="new-password" placeholder="4 caracteres o más"></div><div class="dialog-footer"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button class="btn btn-primary" type="submit">Guardar contraseña</button></div></form>`)}
function modalEditAdmin(id){const p=STORE.profiles.find(x=>x.id===id&&x.role==='supervisor');if(!p)return;showModal('Modificar usuario',`<form data-form="edit-admin" class="form-stack"><input type="hidden" name="id" value="${escapeHtml(id)}"><div class="field"><label>Usuario de ingreso</label><input class="input" name="username" value="${escapeHtml(p.username.toUpperCase())}" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9._-]+"></div><div class="field"><label>Nombre visible</label><input class="input" name="displayName" value="${escapeHtml(p.displayName)}" required></div><div class="dialog-footer"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button class="btn btn-primary" type="submit">Guardar cambios</button></div></form>`)}
function importModal(){showModal('Importar inventario',`<form data-form="import" class="form-stack"><div class="import-zone">${I('file')}<strong>Selecciona un Excel o CSV</strong><p class="small muted">Acepta .xlsx, .xls, .csv y .json</p><input name="file" type="file" accept=".xlsx,.xls,.csv,.json" required style="max-width:100%;font-size:12px"/></div><div class="dialog-footer"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button class="btn btn-primary" type="submit">${I('upload')} Importar archivo</button></div></form>`);}
async function parseExcel(file){let name=file.name.toLowerCase();let data;if(name.endsWith('.json')){data=JSON.parse(await file.text());if(!Array.isArray(data))throw Error('El JSON debe ser una lista de productos.');return await mapRows(data)}if(name.endsWith('.csv')){let txt=await file.text();return await mapRows(csvParse(txt))}
 if(!window.XLSX){await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(Error('No se pudo cargar el lector de Excel. Revisa tu conexión o utiliza CSV.'));document.head.appendChild(s)})}
 let wb=window.XLSX.read(await file.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];let arr=window.XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});return await mapRows(arr)
}
function csvParse(str){let rows=[],row=[],cell='',quote=false;for(let i=0;i<str.length;i++){let c=str[i];if(c==='"'){if(quote&&str[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&str[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}if(!rows.length)return[];let header=rows.shift().map(x=>x.replace(/^\uFEFF/,''));return rows.map(r=>Object.fromEntries(header.map((h,i)=>[h,r[i]])))}
function numv(x){if(typeof x==='number')return x;let v=String(x??'').trim().replace(/[$ ]/g,'');if(v.includes(',')&&!v.includes('.'))v=v.replace(',','.');else if(v.includes(',')&&v.includes('.'))v=v.replaceAll(',','');return Number(v)||0}
async function stableId(code,name){let key=`${code}|${name.toUpperCase()}`;if(crypto?.subtle){let ar=await crypto.subtle.digest('SHA-1',new TextEncoder().encode(key));return 'pf-'+[...new Uint8Array(ar)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,14)}let h=2166136261;for(const c of key)h=(h^c.charCodeAt(0))*16777619;return 'pf-'+(h>>>0).toString(16)}
async function mapRows(rows){const map=new Map();for(const row of rows){let rowObj=Object.fromEntries(Object.entries(row).map(([k,v])=>[norm(k).replace(/\s+/g,''),v]));let get=(...keys)=>{for(let k of keys){let v=rowObj[norm(k).replace(/\s+/g,'')];if(v!==undefined)return v}return''};let code=String(get('codigo','code','código','sku')||'').trim().replace(/\.0$/,'');let name=String(get('producto','name','nombre','descripcion')||'').trim();if(!name||!code)continue;let qty=numv(get('total','theoretical','stock','cantidadtotal'));let packs=numv(get('qty','packs','cajas'));let factor=numv(get('unid por presentacion','unidporpresentacion','unitsPerPresentation'))||1;if(qty===0&&packs)qty=packs*factor;let id=await stableId(code,name),p={id,code,name,category:String(get('categoria','category')||''),presentation:String(get('presentacion','presentation')||'UNIDAD'),unitsPerPresentation:factor,packs,theoretical:qty,pvpUnit:numv(get('pvp unidad','pvpUnit')),pvpTotal:numv(get('pvp total','pvpTotal')),costUnit:numv(get('pvf','costUnit')),costTotal:numv(get('pvf total','costTotal')),sourceRows:[]};if(map.has(id)){let old=map.get(id);old.theoretical+=p.theoretical;old.packs+=p.packs;old.costTotal+=p.costTotal}else map.set(id,p)}return [...map.values()]}
function exportCsv(rows,filename){if(!rows.length)return notify('No hay registros para exportar.','error');let keys=Object.keys(rows[0]),esc=s=>'"'+String(s??'').replaceAll('"','""')+'"',csv='\uFEFF'+keys.map(esc).join(',')+'\r\n'+rows.map(r=>keys.map(k=>esc(r[k])).join(',')).join('\r\n');let a=document.createElement('a'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'});a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function countCSV(){return STORE.counts.map(c=>{let p=STORE.products.find(x=>x.id===c.skuId);return{codigo:p?.code||'',producto:p?.name||'',colaborador:c.name,caja:c.position,cantidad:c.qty,caducidad:formatDate(c.expiry),registro:c.createdAt,modificado:c.updatedAt||''}})}
function prepareSound(){try{let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;let ctx=new AC();ctx.resume?.();return ctx}catch{return null}}
function beep(prepared){try{let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;let ctx=prepared||new AC(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type='sine';osc.frequency.setValueAtTime(730,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(1030,ctx.currentTime+.105);gain.gain.setValueAtTime(.12,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16);osc.start();osc.stop(ctx.currentTime+.17);osc.onended=()=>ctx.close();navigator.vibrate?.(45)}catch{}}
const refreshTable=debounce(updateTables,120);
document.addEventListener('input',e=>{if(e.target.id==='dashboard-search'){STATE.query=e.target.value;STATE.page=0;refreshTable()}if(e.target.id==='inventory-search'){STATE.invQuery=e.target.value;STATE.invPage=0;refreshTable()}if(e.target.id==='expiry-search'){STATE.expiryQuery=e.target.value;refreshTable()}if(e.target.id==='worker-search'){STATE.workerQuery=e.target.value;STATE.selected=null;updateSuggestions()}});
document.addEventListener('change',e=>{if(e.target.id==='dashboard-status'){STATE.status=e.target.value;STATE.page=0;updateTables()}if(e.target.id==='expiry-range'){STATE.expiryRange=e.target.value;updateTables()}});
document.addEventListener('click',async e=>{let b=e.target.closest('[data-action]');if(!b)return;let action=b.dataset.action,id=b.dataset.id;try{
 if(action==='back'){STATE.loginType='';render()}else if(action==='role'){STATE.loginType=b.dataset.role;render()}else if(action==='nav'){STATE.panel=b.dataset.route;STATE.page=0;render()}else if(action==='collapse'){STATE.collapsed=!STATE.collapsed;localStorage.setItem(PREFIX+'collapsed',String(STATE.collapsed));render()}else if(action==='logout'){signOut()}else if(action==='close-modal'){closeModal()}else if(action==='pick-product'){STATE.selected=id;STATE.workerQuery='';let x=document.getElementById('worker-search');if(x)x.value='';updateSuggestions();document.getElementById('worker-qty')?.focus()}else if(action==='clear-product'){STATE.selected=null;STATE.workerQuery='';updateSuggestions();document.getElementById('worker-search')?.focus()}else if(action==='page'){if(b.dataset.kind==='dash')STATE.page+=Number(b.dataset.step);else STATE.invPage+=Number(b.dataset.step);updateTables()}else if(action==='detail'){showDetail(id)}else if(action==='edit-count'){showCountEditor(id)}else if(action==='delete-count'){if(!confirm('¿Eliminar este registro de conteo? Los indicadores se actualizarán automáticamente.'))return;let c=STORE.counts.find(x=>x.id===id);if(STORE.role==='operator'&&c?.uid!==STORE.uid)throw Error('Sin permiso.');await adapter.deleteCount(id);closeModal();notify('Registro eliminado.');if(STORE.appMode==='demo')render()}
 else if(action==='edit-product'){showProductEditor(id)}else if(action==='new-product'){showProductEditor(null)}else if(action==='delete-product'){let p=STORE.products.find(x=>x.id===id);if(!confirm(`¿Eliminar ${p?.name||'este producto'} del catálogo?`))return;await adapter.deleteProduct(id);notify('Producto eliminado.');if(STORE.appMode==='demo')render()}
 else if(action==='import-modal'){importModal()}else if(action==='new-admin'){modalNewAdmin()}else if(action==='edit-admin'){modalEditAdmin(id)}else if(action==='change-pass'){modalPassword(id)}else if(action==='toggle-user'){if(!confirm('¿Cambiar el estado de este acceso?'))return;await adapter.toggleUser(id);notify('Estado actualizado.');if(STORE.appMode==='demo')render()}
 else if(action==='export-counts'){exportCsv(countCSV(),'puntofarma_conteos.csv')}else if(action==='export-expiry'){exportCsv(countCSV().filter(x=>x.caducidad),'puntofarma_caducidades.csv')}else if(action==='export-inventory'){exportCsv(STORE.products.map(p=>({codigo:p.code,producto:p.name,categoria:p.category,presentacion:p.presentation,teorico:p.theoretical,costoTotal:p.costTotal})),'puntofarma_inventario.csv')}

 }catch(err){notify(err.message||'Ocurrió un error.','error')}});
document.addEventListener('submit',async e=>{let form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();if(STATE.busy)return;STATE.busy=true;let btn=form.querySelector('[type=submit],button:not([type])'),fd=Object.fromEntries(new FormData(form));if(btn)btn.disabled=true;try{
 switch(form.dataset.form){
 case 'first-admin':{let name=String(fd.username||'').trim().toLowerCase();loginEmail(name);let u=await adapter.createFirst(name,String(fd.password),String(fd.displayName));STORE.user=u;appEnter('supervisor',u);notify('Supervisor configurado.');break}
 case 'admin-login':{let user=await adapter.authenticate(String(fd.username||''),String(fd.password||''));appEnter('supervisor',user);notify('Acceso autorizado.');break}
 case 'worker-login':{let name=String(fd.displayName||'').trim().replace(/\s+/g,' ');if(name.length<3)throw Error('Ingresa al menos 3 caracteres.');let u=await adapter.loginWorker(name);appEnter('operator',u);notify('Sesión de conteo iniciada.');break}
 case 'count':{let p=STORE.products.find(x=>x.id===STATE.selected);if(!p){let search=String(document.getElementById('worker-search')?.value||'').trim();let exact=STORE.products.filter(x=>x.code===search||norm(x.name)===norm(search));if(exact.length===1)p=exact[0]}if(!p)throw Error('Primero selecciona un producto de la lista.');let qty=Number(fd.qty),position=String(fd.position||'').trim(),expiry=String(fd.expiry||'');if(!Number.isSafeInteger(qty)||qty<=0)throw Error('La cantidad debe ser un número entero mayor a cero.');if(!/^\d+$/.test(position))throw Error('La posición debe contener solamente números.');if(!validDate(expiry))throw Error('Debes ingresar una fecha de caducidad válida.');let c={id:strId(),skuId:p.id,uid:STORE.uid,name:STORE.user.displayName,qty,position,expiry,createdAt:now()};let sound=prepareSound();await adapter.saveCount(c);STATE.selected=null;STATE.workerQuery='';beep(sound);notify(`${qty} unidad(es) registradas correctamente.`);if(STORE.appMode==='demo'){render()}else {form.reset();updateSuggestions()};document.getElementById('worker-search')?.focus();break}
 case 'edit-count':{let id=String(fd.id),c=STORE.counts.find(x=>x.id===id);if(!c||STORE.role==='operator'&&c.uid!==STORE.uid)throw Error('Sin permiso para editar.');let qty=Number(fd.qty),pos=String(fd.position||'').trim();if(!Number.isSafeInteger(qty)||qty<=0||!/^\d+$/.test(pos)||!validDate(String(fd.expiry)))throw Error('Cantidad, posición o caducidad inválida.');await adapter.editCount(id,{qty,position:pos,expiry:String(fd.expiry)});closeModal();notify('Conteo actualizado.');if(STORE.appMode==='demo')render();break}
 case 'product-editor':{let name=String(fd.name||'').trim(),code=String(fd.code||'').trim(),theoretical=Number(fd.theoretical);if(!name||!code||!Number.isSafeInteger(theoretical)||theoretical<0)throw Error('Producto, código o cantidad inválidos.');let id=String(fd.id||'');let p=STORE.products.find(x=>x.id===id);let updates={name,code,category:String(fd.category||''),presentation:String(fd.presentation||''),unitsPerPresentation:Number(fd.unitsPerPresentation||1),theoretical,costTotal:Math.max(0,Number(fd.costTotal||0))};if(p)await adapter.updateProduct(id,updates);else{let newId=await stableId(code,name);if(STORE.products.some(x=>x.id===newId))throw Error('Este producto ya existe en el catálogo.');await adapter.upsertProducts([{id:newId,packs:0,pvpUnit:0,pvpTotal:0,costUnit:0,sourceRows:[],...updates}])}closeModal();notify('Producto guardado.');if(STORE.appMode==='demo')render();break}
 case 'new-admin':{let uname=String(fd.username||'').trim().toLowerCase();loginEmail(uname);if(String(fd.password||'').length<4)throw Error('Usa una contraseña de al menos 4 caracteres.');await adapter.createUser(uname,String(fd.password),String(fd.displayName||'').trim());closeModal();notify('Usuario creado.');render();break}
 case 'edit-admin':{await adapter.renameUser(String(fd.id),String(fd.username||''),String(fd.displayName||''));closeModal();notify('Usuario actualizado.');render();break}
 case 'password':{if(String(fd.password||'').length<4)throw Error('La contraseña debe tener 4 caracteres o más.');await adapter.changePassword(String(fd.id),String(fd.password));closeModal();notify('Contraseña actualizada.');break}
 case 'import':{let file=form.querySelector('input[type="file"]')?.files?.[0];if(!file)throw Error('Selecciona el archivo.');notify('Leyendo archivo…');let products=await parseExcel(file);if(!products.length)throw Error('No se detectaron productos con código y nombre.');await adapter.upsertProducts(products);closeModal();notify(`${products.length} productos importados/actualizados; conteos conservados.`);if(STORE.appMode==='demo')render();break}

 }
 }catch(err){console.error('PuntoFarma / operación:',err);notify(humanError(err),'error')}finally{STATE.busy=false;if(btn&&btn.isConnected)btn.disabled=false}});
window.addEventListener('storage',event=>{if(STORE.appMode==='demo'&&event.key?.startsWith(PREFIX)){loadLocalData();if(STATE.screen==='app')render()}});
async function bootstrap(){
 STORE.appMode='demo';adapter=demoAdapter;loadLocalData();
 if(!STORE.profiles.some(p=>p.role==='supervisor')){
   await demoAdapter.createFirst('KEVIN','1234','Kevin');
 }
 render();
}
bootstrap();
})();
